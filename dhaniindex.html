<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DHANI WIN OFFICIAL</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    font-family: 'Inter', sans-serif;
    background: #1c0a14;
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-x: hidden;
  }

  .page {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 40px;
    background: radial-gradient(ellipse at center top, #3a0a20 0%, #1c0a14 60%);
  }

  /* CARD */
  .card {
    background: linear-gradient(170deg, #ff7a2f 0%, #ff3d6e 45%, #e8006a 100%);
    border-radius: 30px;
    padding: 30px 22px 28px;
    width: calc(100% - 24px);
    margin: 0 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    margin-top: 90px;
    box-shadow: 0 10px 50px rgba(255,60,100,0.5), 0 0 80px rgba(255,60,100,0.2);
  }

  /* LOGO - perfect circle */
  .logo-wrap {
    position: absolute;
    top: -80px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px;
    height: 118px;
    border-radius: 50%;
    overflow: hidden;
    border: 5px solid #1c0a14;
    box-shadow: 0 0 0 2px rgba(255,140,0,0.5), 0 8px 30px rgba(0,0,0,0.8);
    background: #000;
  }
  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center center;
    display: block;
  }

  /* TITLE */
  .title {
    font-size: clamp(20px, 6vw, 28px);
    font-weight: 900;
    color: #fff;
    text-align: center;
    letter-spacing: 0.5px; white-space: nowrap;
    margin-bottom: 12px;
    margin-top: 6px;
    text-transform: uppercase;
    text-shadow: 0 2px 12px rgba(0,0,0,0.25);
  }

  /* SUBTITLE */
  .subtitle {
    font-size: clamp(14px, 4vw, 16px);
    color: rgba(255,255,255,0.95);
    text-align: center;
    font-weight: 500;
    line-height: 1.6;
    margin-bottom: 22px;
  }
  .highlight {
    color: #ffe033;
    font-weight: 900;
    font-style: italic;
  }

  /* RESULT */
  .result-label {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 12px;
    text-align: center;
  }

  .result-box {
    background: rgba(70, 5, 30, 0.65);
    border-radius: 18px;
    padding: 16px 18px 20px;
    width: 100%;
    margin-bottom: 14px;
  }

  .period-id {
    font-size: 13.5px;
    color: rgba(255,255,255,0.55);
    text-align: center;
    margin-bottom: 18px;
    font-weight: 500;
  }

  .result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .number-circle {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: 900;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 4px 18px rgba(0,0,0,0.4);
    transition: background 0.4s;
  }

  .bigsmall-badge {
    background: #fff;
    font-size: 24px;
    font-weight: 900;
    padding: 16px 0;
    border-radius: 50px;
    flex: 1;
    text-align: center;
    letter-spacing: 0.5px; white-space: nowrap;
    transition: color 0.4s;
  }

  /* TICKER */
  .ticker {
    background: #000;
    border: 2px solid #22c55e;
    border-radius: 10px;
    padding: 13px 14px;
    width: 100%;
    font-size: clamp(12px, 3.5vw, 14px);
    font-weight: 700;
    color: #22c55e;
    font-family: 'Courier New', monospace;
    letter-spacing: 1.5px;
    text-align: center;
  }

  /* BUTTONS */
  .buttons {
    width: calc(100% - 24px);
    margin: 20px 12px 0;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .join-btn {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, #ffd600, #ffb300);
    color: #1a0800;
    font-size: clamp(18px, 5.5vw, 22px);
    font-weight: 900;
    text-align: center;
    text-decoration: none;
    padding: 20px;
    border-radius: 16px;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 0 6px 25px rgba(255,180,0,0.45);
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.1s;
  }
  .join-btn:active { transform: scale(0.97); }
</style>
</head>

    document.getElementById('resultType').textContent = n >= 5 ? 'BIG' : 'SMALL';
    document.getElementById('resultType').style.color = n >= 5 ? '#16a34a' : '#dc2626';
    document.getElementById('periodId').textContent = 'Period ID: ' + generatePeriodId();
  }

  let seconds = 10;
  function tick() {
    document.getElementById('countdown').textContent = seconds + 'S';
    if (seconds <= 0) {
      updateResult();
      seconds = Math.floor(Math.random() * 25) + 8;
    } else {
      seconds--;
    }
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>
